name: SeviL
options:
  bundleIdPrefix: com.sevil
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
targets:
  SeviL:
    type: application
    platform: iOS
    sources:
      - path: SeviL
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: SeviL/Info.plist
      properties:
        CFBundleDisplayName: SeviL
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Record lectures you have permission to capture.
        NSCameraUsageDescription: Photograph classroom boards while keeping your lecture recording active.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.sevil.learncompanion
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [SeviLTests]
  SeviLTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SeviLTests]
    dependencies:
      - target: SeviL
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
