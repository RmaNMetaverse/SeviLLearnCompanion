services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      SEVIL_DATA_DIR: /data
      SEVIL_ENV: production
    volumes:
      - sevil-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]
    restart: unless-stopped
volumes:
  sevil-data:
