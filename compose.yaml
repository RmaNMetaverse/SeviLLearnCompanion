services:
  api:
    profiles: [legacy-api]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      SEVIL_DATA_DIR: /data
      SEVIL_ENV: production
    volumes:
      - sevil-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  sevil-data:
