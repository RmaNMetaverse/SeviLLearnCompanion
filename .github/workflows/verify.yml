name: Verify all platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt
      - run: python scripts/sync-locales.py --check
      - run: python scripts/export-contract.py --check
      - run: python -m pytest services/api/tests -q
        env:
          PYTHONPATH: services/api
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x apps/android/gradlew
      - run: apps/android/gradlew -p apps/android assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: SeviL-Android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - run: xcodebuild -project apps/ios/SeviL.xcodeproj -scheme SeviL -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/SeviLDerivedData CODE_SIGNING_ALLOWED=NO build
